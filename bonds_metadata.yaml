# API field 'Yield' is always 0 for all bonds — do not use it.
# Cross-validated fields: maturity_date vs API maturity_d, face_value vs API face_val_a, isin vs API issue_nb
#
# api_validated: true  = maturity + face_value confirmed against live API response
# api_validated: false = only API data available, not yet verified from exchange website
#
# To update: find the bond on kase.kz or aix.kz by ISIN, copy the fields below, set api_validated: true

